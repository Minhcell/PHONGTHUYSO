name: Build EXE + APK + iOS + Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chuẩn bị file app
        shell: bash
        run: |
          mkdir -p electron/app
          cp app/index.html electron/app/index.html
          cp electron/build/icon.png electron/app/icon.png
      - name: Cài và build EXE
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: PhongThuySo-Windows
          path: |
            electron/dist/PhongThuySo-Portable.exe
            electron/dist/PhongThuySo-Setup.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cài Android SDK (platform 34, build-tools 34)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM=$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Dùng $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Đồng bộ index.html vào APK
        run: cp app/index.html android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PhongThuySo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhongThuySo-Android
          path: PhongThuySo.apk

  web-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo bản web offline (PWA)
        run: python3 tools/make_web.py "${{ github.run_number }}-${GITHUB_SHA::7}"
      - name: Nén thư mục web
        run: cd dist-web && zip -qr ../PhongThuySo-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: PhongThuySo-Web
          path: PhongThuySo-Web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  pages:
    needs: web-pwa
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  ios-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Đồng bộ index.html vào app iOS
        run: cp app/index.html ios/Resources/www/index.html
      - name: Tạo project Xcode
        working-directory: ios
        run: xcodegen generate
      - name: Build (không ký)
        working-directory: ios
        run: |
          xcodebuild -project PhongThuySo.xcodeproj -target PhongThuySo -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Đóng gói IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PhongThuySo.app Payload/
          zip -qry ../PhongThuySo-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhongThuySo-iOS
          path: PhongThuySo-iOS.ipa

  release:
    needs: [ windows-exe, android-apk, ios-ipa, web-pwa ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Phong Thủy Số v1.0.${{ github.run_number }}
          body: "Bản build tự động: PhongThuySo-Portable.exe (PC, chạy ngay), PhongThuySo-Setup.exe (PC, bộ cài), PhongThuySo.apk (Android), PhongThuySo-iOS.ipa (iPhone/iPad – chưa ký, cài qua Sideloadly/AltStore), PhongThuySo-Web.zip (bản web offline – kéo thả lên Netlify, mở bằng Safari rồi Thêm vào MH chính)."
          files: |
            out/PhongThuySo-Windows/PhongThuySo-Portable.exe
            out/PhongThuySo-Windows/PhongThuySo-Setup.exe
            out/PhongThuySo-Android/PhongThuySo.apk
            out/PhongThuySo-iOS/PhongThuySo-iOS.ipa
            out/PhongThuySo-Web/PhongThuySo-Web.zip
